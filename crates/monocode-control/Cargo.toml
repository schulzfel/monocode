[package]
workspace = "../monocode-gpui"
name = "monocode-control"
version.workspace = true
edition = "2024"
# The first stable release with `std::hint::cold_path`, which the vendored GPUI needs.
rust-version = "1.95"
license.workspace = true
publish = false
description = "The typed command set, wire frames and local-socket transport for external control of MonoCode."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The major version rmcp uses, so tool schemas come out the same way.
schemars = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4", default-features = false }
widestring = "1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
